services:
  - type: web
    name: iastam-edge-fire-demo
    runtime: docker
    dockerfilePath: demo/Dockerfile
    dockerContext: demo
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 7860
      - key: RENDER
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
