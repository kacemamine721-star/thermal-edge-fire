# Dataset configurations and paths
data:
  activefire_root: "data/raw/activefire"
  tssatfire_root: "data/raw/tssatfire"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  reports_dir: "reports"

# Pereira et al. ActiveFire dataset configuration
activefire:
  repo_url: "https://github.com/pereira-gha/activefire.git"
  # Release options:
  #   manual: 9,044 manually annotated patches from 13 scenes (high quality ground truth)
  #   subset: small random sample for pipeline dry-runs
  #   full: 11 regional archives (~50GB, 146,214 patches)
  default_algorithm: "voting"  # voting | intersection | kumar | murphy | schroeder
  bands:
    names: ["B1", "B2", "B3", "B4", "B5", "B6", "B7", "B9", "B10", "B11"]
    coastal_aerosol: 0  # B1
    blue: 1             # B2
    green: 2            # B3
    red: 3              # B4
    nir: 4              # B5
    swir1: 5            # B6 (1.57 - 1.65 um)
    swir2: 6            # B7 (2.11 - 2.29 um)
    cirrus: 7           # B9
    lwir1: 8            # B10 (10.6 - 11.19 um) - thermal
    lwir2: 9            # B11 (11.5 - 12.51 um) - thermal
  thermal_channels: [8, 9]  # 0-indexed: B10, B11
  swir_channels: [5, 6]     # 0-indexed: B6, B7
  patch_size: [256, 256]
  bit_depth: 16

# TS-SatFire Kaggle dataset configuration
tssatfire:
  kaggle_dataset: "z789456sx/ts-satfire"
  repo_url: "https://github.com/zhaoyutim/TS-SatFire.git"
  expected_bands: ["M11", "I2", "I1", "I4", "I5", "AF_mask"]
  thermal_bands: ["I4", "I5"]  # I4 = MWIR (~3.74 um), I5 = LWIR (~11.45 um)
  lwir_band: "I5"

# Validation quality gate settings (Stage 0 / Stage 1)
validation:
  bit_depth: 16
  nodata_value: 0.0
  nodata_frac_reject: 0.30
  nonfinite_frac_reject: 0.01
  saturation_frac_reject: 0.02
  out_of_range_frac_flag: 0.0005
  out_of_range_frac_reject: 0.05
  jump_frac_flag: 0.005
  jump_frac_reject: 0.10
  noise_floor: 1.0
  stripe_k: 10.0
  stripe_frac_reject: 0.20
  hot_k: 8.0
  hot_isolation_ratio: 0.35
  hot_frac_reject: 0.01
  hot_pixel_policy: "flag"  # "flag" preserves raw values; "repair" replaces with 3x3 median
  cross_channel_confirm: true

# Exploration & Sampling parameters
sampling:
  seed: 42
  sample_size_exploration: 2000
  calib_fraction: 0.20
